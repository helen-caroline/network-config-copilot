[project]
name = "network-config-copilot"
version = "0.1.0"
description = "Traduz pedidos em linguagem natural para comandos de rede reais, valida e aplica via SSH."
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4",
    "anthropic>=0.40",
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
netcopilot = "netcopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netcopilot*"]
